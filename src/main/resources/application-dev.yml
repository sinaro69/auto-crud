spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/minio
    password : postgres
    username : postgres
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

minio:
  endpoint: https://s3.sansiarodev.xyz
  accessKey: minioadmin
  secretKey: minioadmin

server:
  port: 8095

stream:
  uri: http://127.0.0.1:7000/video-upload/
  image: http://127.0.0.1:9090/api/medias/images/view/